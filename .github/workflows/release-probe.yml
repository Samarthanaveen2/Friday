name: Release probe

# One-off check of what the Actions token may publish (release creation started failing with 403).
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - run: |
          echo "a: old commit"; gh release create probe-a --target 865625655ae3f92dca35eb936fb10d2842a1b635 --notes probe --prerelease && gh release delete probe-a --yes --cleanup-tag || true
          echo "b: default branch"; gh release create probe-b --notes probe --prerelease && gh release delete probe-b --yes --cleanup-tag || true
          echo "c: this commit"; gh release create probe-c --target "$GITHUB_SHA" --notes probe --prerelease && gh release delete probe-c --yes --cleanup-tag || true
          echo "d: list"; gh release list || true
          echo "e: tag via git"; git init -q x && cd x && git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GH_REPO}.git" && git fetch -q --depth 1 origin $GITHUB_SHA && git tag probe-e FETCH_HEAD && git push origin probe-e && git push origin :refs/tags/probe-e || true
