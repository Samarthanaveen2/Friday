name: Speech bench

# How many words each speech-to-text setup loses on 30 real, long Indian-English dictations.
# Manual, or when the bench itself changes. Uses part of Groq's free hourly audio allowance.
on:
  push:
    branches: [claude/affectionate-fermat-scvp7y]
    paths: ["ios/tools/speech_bench.py", "ios/speechbench/**",
            "ios/FridayCore/Sources/FridayEval/**", ".github/workflows/speech-bench.yml"]
  workflow_dispatch:
    inputs:
      setups:
        description: "Setups to compare (model[+prompt], space separated)"
        default: "whisper-large-v3-turbo+prompt whisper-large-v3+prompt"

jobs:
  bench:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg > /dev/null
      - run: python3 -I ios/tools/speech_bench.py ios/speechbench ${{ github.event.inputs.setups || 'whisper-large-v3-turbo+prompt whisper-large-v3+prompt' }} | tee bench.txt
      - run: sed -n '/^| setup/,$p' bench.txt >> "$GITHUB_STEP_SUMMARY"


  # Whisper as the app sends it, then the app's cleanup on top: does the cleanup ever drop
  # what was said? Skips against Whisper's own text = words the cleanup removed.
  cleanup:
    runs-on: ubuntu-latest
    container: swift:6.1-noble
    timeout-minutes: 40
    env:
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - run: apt-get update -qq && apt-get install -y -qq ffmpeg python3 > /dev/null
      - name: Whisper
        run: SAVE_DIR=. python3 -I ios/tools/speech_bench.py ios/speechbench whisper-large-v3-turbo+prompt | tail -4
      - name: Cleanup
        run: swift run -q --package-path ios/FridayCore FridayEval clean whisper-large-v3-turbo+prompt.json > typed.json
      - name: Score
        run: |
          echo "## Typed text vs what was said" >> "$GITHUB_STEP_SUMMARY"
          python3 -I ios/tools/speech_bench.py ios/speechbench file:whisper-large-v3-turbo+prompt.json file:typed.json | tee said.txt
          sed -n '/^| setup/,$p' said.txt >> "$GITHUB_STEP_SUMMARY"
          echo "## Typed text vs Whisper (what the cleanup removed)" >> "$GITHUB_STEP_SUMMARY"
          REF_JSON=whisper-large-v3-turbo+prompt.json python3 -I ios/tools/speech_bench.py ios/speechbench file:typed.json | tee removed.txt
          sed -n '/^| setup/,$p' removed.txt >> "$GITHUB_STEP_SUMMARY"
          paste -d'\n' /dev/null > /dev/null
          cat typed.json | head -40
