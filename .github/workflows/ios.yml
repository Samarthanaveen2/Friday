name: iOS build

on:
  push:
    branches: ['claude/**']
    paths: ['ios/**', '.github/workflows/ios.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Install tools
        run: brew install xcodegen

      - name: Generate Xcode project
        working-directory: ios
        run: xcodegen generate

      - name: Build (unsigned)
        working-directory: ios
        run: |
          set -o pipefail
          xcodebuild \
            -project Friday.xcodeproj \
            -scheme Friday \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            CURRENT_PROJECT_VERSION=${{ github.run_number }} \
            MARKETING_VERSION=0.1.${{ github.run_number }} \
            build 2>&1 | tee build.log | grep -E "error:|warning: unre|BUILD|\*\*" || true
          grep -q "BUILD SUCCEEDED" build.log

      - name: Sign with entitlements (so SideStore sees the App Group) and make the .ipa
        working-directory: ios
        run: |
          set -e
          exec > >(tee sign.log) 2>&1
          APP=build/Build/Products/Release-iphoneos/Friday.app
          ENT="$PWD/Entitlements/Friday.entitlements"
          # Ad-hoc sign (no certificate needed): this writes the entitlements into each binary's
          # signature, which is where SideStore reads them. Inner bundles first, app last.
          for x in "$APP"/PlugIns/*.appex; do
            codesign --force --sign - --entitlements "$ENT" "$x"
          done
          codesign --force --sign - --entitlements "$ENT" "$APP"
          # Fail the build if the App Group did not make it in.
          for x in "$APP"/PlugIns/*.appex "$APP"; do
            codesign -d --entitlements - "$x" 2>&1 | tee /tmp/ent.txt
            grep -q "group.com.samarth.friday" /tmp/ent.txt || { echo "MISSING App Group in $x"; exit 1; }
          done
          rm -rf out && mkdir -p out/Payload
          cp -R "$APP" out/Payload/
          (cd out && zip -qry ../Friday.ipa Payload)
          ls -l Friday.ipa

      - name: Upload sign log (debug)
        if: always()
        working-directory: ios
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          [ -f sign.log ] || echo "no sign.log" > sign.log
          ls -R build/Build/Products/Release-iphoneos/Friday.app | head -40 >> sign.log
          gh release view latest >/dev/null 2>&1 && gh release upload latest sign.log --clobber || true

      - name: Make the SideStore source file
        working-directory: ios
        run: |
          SIZE=$(stat -f%z Friday.ipa)
          DATE=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          cat > sidestore-source.json <<EOF
          {
            "name": "Friday",
            "identifier": "com.samarth.friday.source",
            "apps": [
              {
                "name": "Friday",
                "bundleIdentifier": "com.samarth.friday",
                "developerName": "Samartha",
                "subtitle": "Voice keyboard and voice schedule",
                "localizedDescription": "Friday for iPhone.",
                "tintColor": "4338CA",
                "iconURL": "https://github.com/${{ github.repository }}/releases/download/latest/icon.png",
                "screenshotURLs": [],
                "version": "0.1.${{ github.run_number }}",
                "versionDate": "$DATE",
                "size": $SIZE,
                "downloadURL": "https://github.com/${{ github.repository }}/releases/download/latest/Friday.ipa?build=${{ github.run_number }}"
              }
            ]
          }
          EOF
          cat sidestore-source.json

      - name: Publish to the "latest" release
        working-directory: ios
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view latest >/dev/null 2>&1 || gh release create latest \
            --title "Friday (latest build)" --notes "Auto-built." --target "${{ github.sha }}"
          gh release edit latest --notes "Build ${{ github.run_number }} from ${{ github.ref_name }} (${{ github.sha }})"
          gh release upload latest Friday.ipa sidestore-source.json icon.png --clobber
