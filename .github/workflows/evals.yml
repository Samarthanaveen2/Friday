name: Evals

on:
  push:
    branches: [claude/affectionate-fermat-scvp7y]
    # Only when the prompt or test cases change: each run spends part of Groq's free daily allowance.
    paths: ["ios/evals/**", "ios/FridayCore/Sources/FridayCore/Dictation/Prompt.swift",
            "ios/FridayCore/Sources/FridayCore/Schedule/DecisionPrompt.swift"]
  workflow_dispatch:

concurrency:
  group: evals
  cancel-in-progress: true

jobs:
  dictation:
    name: Dictation evals (app's cleanup code, real Groq)
    runs-on: ubuntu-latest
    container: swift:6.1-noble
    env:
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - name: Decision evals (talk on Home -> actions)
        run: swift run --package-path ios/FridayCore FridayEval decide ios/evals/decision.jsonl
      - name: Dictation evals
        run: swift run --package-path ios/FridayCore FridayEval ios/evals/dictation.jsonl
