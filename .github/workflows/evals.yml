name: Evals

on:
  # Manual only: it uses the same free Groq key as the phone, and an automatic run on every
  # prompt change used up the phone's daily allowance (cleanup then fell back to weaker models).
  workflow_dispatch:

concurrency:
  group: evals
  cancel-in-progress: true

jobs:
  dictation:
    name: Dictation evals (app's cleanup code, real Groq)
    runs-on: ubuntu-latest
    container: swift:6.1-noble
    env:
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - name: Decision evals (talk on Home -> actions)
        run: swift run --package-path ios/FridayCore FridayEval decide ios/evals/decision.jsonl
      - name: Dictation evals
        run: swift run --package-path ios/FridayCore FridayEval ios/evals/dictation.jsonl
