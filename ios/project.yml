# Generated into Friday.xcodeproj by XcodeGen in CI. Never commit the .xcodeproj.
name: Friday
options:
  bundleIdPrefix: com.samarth
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true
  generateEmptyDirectories: false

settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    TARGETED_DEVICE_FAMILY: "1"
    CODE_SIGN_STYLE: Manual
    CODE_SIGNING_ALLOWED: NO
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    GENERATE_INFOPLIST_FILE: NO

packages:
  FridayCore:
    path: FridayCore

# Bundle IDs below must never change once installed (data would be lost).
targets:
  Friday:
    type: application
    platform: iOS
    sources:
      - Friday
      - Shared/Group
      - Shared/Live
    dependencies:
      - package: FridayCore
      - target: FridayKeyboard
      - target: FridayLive
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.samarth.friday
        PRODUCT_NAME: Friday
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: $(inherited) FRIDAY_APP
    info:
      path: Friday/Info.plist
      properties:
        CFBundleDisplayName: Friday
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UIApplicationSupportsIndirectInputEvents: true
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UIBackgroundModes: [audio]
        NSSupportsLiveActivities: true
        NSMicrophoneUsageDescription: Friday listens only while you dictate or talk to it.
        NSSpeechRecognitionUsageDescription: Friday turns your voice into text on the phone as a fast backup.
        CFBundleURLTypes:
          - CFBundleURLName: com.samarth.friday
            CFBundleURLSchemes: [friday]
    entitlements:
      path: Friday/Friday.entitlements
      properties:
        com.apple.security.application-groups: [group.com.samarth.friday]
    scheme: {}

  FridayKeyboard:
    type: app-extension
    platform: iOS
    sources:
      - FridayKeyboard
      - Shared/Group
    dependencies:
      - package: FridayCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.samarth.friday.keyboard
        PRODUCT_NAME: FridayKeyboard
        # Lets the keyboard reach UIApplication.open through the responder chain (opens Friday).
        APPLICATION_EXTENSION_API_ONLY: NO
    info:
      path: FridayKeyboard/Info.plist
      properties:
        CFBundleDisplayName: Friday
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.keyboard-service
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).KeyboardViewController
          NSExtensionAttributes:
            IsASCIICapable: false
            PrefersRightToLeft: false
            PrimaryLanguage: en-US
            RequestsOpenAccess: true
    entitlements:
      path: FridayKeyboard/FridayKeyboard.entitlements
      properties:
        com.apple.security.application-groups: [group.com.samarth.friday]

  FridayLive:
    type: app-extension
    platform: iOS
    sources:
      - FridayLive
      - Shared/Live
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.samarth.friday.live
        PRODUCT_NAME: FridayLive
    info:
      path: FridayLive/Info.plist
      properties:
        CFBundleDisplayName: Friday
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: FridayLive/FridayLive.entitlements
      properties:
        com.apple.security.application-groups: [group.com.samarth.friday]
