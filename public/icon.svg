<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <radialGradient id="bg" cx="50%" cy="50%" r="70%">
      <stop offset="0" stop-color="#0b1a2e"/>
      <stop offset="1" stop-color="#05080f"/>
    </radialGradient>
    <radialGradient id="halo" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#4fd8ff" stop-opacity=".55"/>
      <stop offset=".45" stop-color="#4fd8ff" stop-opacity=".18"/>
      <stop offset="1" stop-color="#4fd8ff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="core" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset=".45" stop-color="#bff3ff"/>
      <stop offset="1" stop-color="#4fd8ff"/>
    </radialGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="512" height="512" fill="url(#bg)"/>
  <circle cx="256" cy="256" r="230" fill="url(#halo)"/>
  <g fill="none" stroke="#4fd8ff" filter="url(#glow)">
    <circle cx="256" cy="256" r="150" stroke-width="14"/>
    <circle cx="256" cy="256" r="118" stroke-width="4" opacity=".55"/>
  </g>
  <g fill="#4fd8ff" filter="url(#glow)" opacity=".85">
    <g id="seg"><rect x="246" y="112" width="20" height="44" rx="6"/></g>
    <use href="#seg" transform="rotate(36 256 256)"/>
    <use href="#seg" transform="rotate(72 256 256)"/>
    <use href="#seg" transform="rotate(108 256 256)"/>
    <use href="#seg" transform="rotate(144 256 256)"/>
    <use href="#seg" transform="rotate(180 256 256)"/>
    <use href="#seg" transform="rotate(216 256 256)"/>
    <use href="#seg" transform="rotate(252 256 256)"/>
    <use href="#seg" transform="rotate(288 256 256)"/>
    <use href="#seg" transform="rotate(324 256 256)"/>
  </g>
  <polygon points="256,170 331,300 181,300" fill="none" stroke="#bff3ff" stroke-width="8" stroke-linejoin="round" filter="url(#glow)" opacity=".8"/>
  <circle cx="256" cy="256" r="44" fill="url(#core)" filter="url(#glow)"/>
</svg>
